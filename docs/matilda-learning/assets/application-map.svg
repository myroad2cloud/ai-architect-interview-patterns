<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" role="img" aria-labelledby="t d"><title id="t">Portal application boundary</title><desc id="d">WEB01 and WEB02 call APP01, which calls SQL01. Shared AD01 and external PAY-API cross the portal boundary and require separate validation.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10" fill="#69dfd0"/></marker></defs><rect width="1100" height="520" rx="20" fill="#0a1e34"/><text x="55" y="53" font-family="Arial" font-size="24" font-weight="bold" fill="#eaf4f6">Northstar portal: proposed application boundary</text><rect x="45" y="84" width="740" height="295" rx="20" fill="#0d2b41" stroke="#58a9ac" stroke-width="2" stroke-dasharray="10 7"/><text x="70" y="113" font-family="Arial" font-size="14" fill="#75e1d4">CORE APPLICATION GROUP</text><g font-family="Arial" text-anchor="middle"><rect x="83" y="172" width="137" height="85" rx="12" fill="#1a5160"/><text x="151" y="209" font-size="18" fill="#fff">WEB01</text><text x="151" y="234" font-size="13" fill="#bce0e4">Web tier</text><rect x="83" y="279" width="137" height="85" rx="12" fill="#1a5160"/><text x="151" y="316" font-size="18" fill="#fff">WEB02</text><text x="151" y="341" font-size="13" fill="#bce0e4">Web tier</text><rect x="340" y="223" width="150" height="95" rx="12" fill="#1a5160"/><text x="415" y="263" font-size="18" fill="#fff">APP01</text><text x="415" y="289" font-size="13" fill="#bce0e4">Business logic</text><rect x="606" y="223" width="145" height="95" rx="12" fill="#1a5160"/><text x="679" y="263" font-size="18" fill="#fff">SQL01</text><text x="679" y="289" font-size="13" fill="#bce0e4">Shared data</text><rect x="842" y="107" width="205" height="88" rx="12" fill="#5b432c" stroke="#e7bc75"/><text x="944" y="144" font-size="18" fill="#fff">AD01</text><text x="944" y="169" font-size="13" fill="#f3d5a3">Shared identity</text><rect x="842" y="269" width="205" height="88" rx="12" fill="#5b432c" stroke="#e7bc75"/><text x="944" y="306" font-size="18" fill="#fff">PAY-API</text><text x="944" y="331" font-size="13" fill="#f3d5a3">External service</text></g><g fill="none" stroke="#69dfd0" stroke-width="3" marker-end="url(#a)"><path d="M220 214 H276 V250 H335"/><path d="M220 322 H276 V290 H335"/><path d="M490 270 H600"/></g><g fill="none" stroke="#f2c67d" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#a)"><path d="M490 234 C650 105 740 115 836 150"/><path d="M490 307 C680 430 740 351 836 315"/></g><text x="55" y="435" font-family="Arial" font-size="16" fill="#b9d3dc">Dashed links cross the core server group. Confirm them with traffic evidence, owners and the cutover plan.</text><text x="55" y="466" font-family="Arial" font-size="14" fill="#a5bfca">Fictional training topology. The graph does not prove ownership, timing or direction of every real-world flow.</text></svg>
