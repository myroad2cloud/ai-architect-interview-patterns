<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 510" role="img" aria-labelledby="t d"><title id="t">Discovery evidence flow</title><desc id="d">An approved Matilda collector reads from Windows, Linux and database targets. Inventory is reconciled with CMDB and application owners before Azure options.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10" fill="#66dfd0"/></marker></defs><rect width="1100" height="510" rx="20" fill="#0a1e34"/><text x="55" y="54" font-family="Arial" font-size="24" font-weight="bold" fill="#e8f2f4">Approved collection paths</text><g font-family="Arial" text-anchor="middle"><rect x="55" y="100" width="220" height="78" rx="12" fill="#173c55" stroke="#69d9cf"/><text x="165" y="132" font-size="19" fill="#fff">Matilda collector</text><text x="165" y="158" font-size="14" fill="#accbd4">Scoped network source</text><rect x="465" y="85" width="230" height="72" rx="12" fill="#193a51" stroke="#567d91"/><text x="580" y="115" font-size="18" fill="#fff">Windows servers</text><text x="580" y="138" font-size="14" fill="#bad2db">WinRM, SMB</text><rect x="465" y="195" width="230" height="72" rx="12" fill="#193a51" stroke="#567d91"/><text x="580" y="225" font-size="18" fill="#fff">Linux servers</text><text x="580" y="248" font-size="14" fill="#bad2db">SSH</text><rect x="465" y="305" width="230" height="72" rx="12" fill="#193a51" stroke="#567d91"/><text x="580" y="335" font-size="18" fill="#fff">Databases</text><text x="580" y="358" font-size="14" fill="#bad2db">Metadata access</text><rect x="820" y="124" width="225" height="95" rx="12" fill="#1b4a52" stroke="#69d9cf"/><text x="932" y="157" font-size="18" fill="#fff">Inventory and</text><text x="932" y="182" font-size="18" fill="#fff">discovery status</text><rect x="820" y="285" width="225" height="95" rx="12" fill="#58412e" stroke="#f4c97e"/><text x="932" y="318" font-size="18" fill="#fff">Reconcile with CMDB</text><text x="932" y="343" font-size="15" fill="#f5d9a8">and application owners</text></g><g fill="none" stroke="#66dfd0" stroke-width="3" marker-end="url(#a)"><path d="M275 138 H380 V121 H461"/><path d="M275 138 H380 V231 H461"/><path d="M275 138 H380 V341 H461"/><path d="M696 121 H752 V171 H816"/><path d="M696 231 H752 V171 H816"/><path d="M696 341 H752 V171 H816"/><path d="M932 221 V280"/></g><text x="55" y="451" font-family="Arial" font-size="16" fill="#a7c7d1">Vendor-specific ports and permissions require security approval. A scan result is not yet an agreed application baseline.</text></svg>
